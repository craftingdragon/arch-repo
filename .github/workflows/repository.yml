name: Build and publish repository
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild every package without reuse
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: repository-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: python scripts/build.py
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
      # Package filenames may contain epochs (:) that upload-artifact rejects.
      - name: Pack build outputs for transfer
        run: tar -cf packages.tar -C out .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: packages.tar
          compression-level: 0
          if-no-files-found: error
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: repository-signing
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python gnupg pacman
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts
      - name: Unpack build outputs
        run: |
          mkdir -p out
          tar -xf artifacts/packages.tar -C out
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages
      - run: bash scripts/publish.sh
        env:
          SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
  deploy:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
